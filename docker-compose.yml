
networks:
  devnet:
    driver: bridge

volumes:
  mysql_data:
    driver: local

services:
  web:
    container_name: rms-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/.venv  # Exclude .venv from mount for performance
    env_file:
      - .env
    environment:
      - DB_HOST=mysql  # Override for Docker networking
    depends_on:
      - mysql
    networks:
      - devnet
    restart: unless-stopped

  mysql:
    container_name: rms-mysql
    image: mysql:8.0
    ports:
      - "23306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - devnet
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
