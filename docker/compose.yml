version: '3.8'

networks:
  devnet:
    driver: bridge

volumes:
  mysql_data:
    driver: local

services:
  web:
    container_name: rms-app
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ../:/app
      - /app/.venv  # Exclude .venv from mount for performance
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=mysql+pymysql://root:password@mysql:3306/rms_db
    depends_on:
      - mysql
    networks:
      - devnet
    restart: unless-stopped

  mysql:
    container_name: rms-mysql
    image: mysql:8.0
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rms_db
      MYSQL_USER: rms_user
      MYSQL_PASSWORD: rms_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../src/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - devnet
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
