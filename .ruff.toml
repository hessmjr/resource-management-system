# Ruff configuration file
target-version = "py312"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]

ignore = [
    "S101",  # Use of assert detected (OK in tests)
    "S608",  # Possible SQL injection (we'll fix these manually)
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
"src/test.py" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"